<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="About the Product">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.55" stop-color="#EEF5FA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="190" fill="#FA6A63" opacity="0.13"/>
  <circle cx="90" cy="650" r="220" fill="#0E3B64" opacity="0.10"/>
  <rect x="60" y="54" width="1160" height="612" rx="38" fill="#ffffff" stroke="#D9E2EC" stroke-width="2"/>
  <text x="84" y="132" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#FA6A63">READYDORM</text>
  <text x="84" y="194" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#082B49">About the Product</text>
  <text x="84" y="235" font-family="Inter, Arial, sans-serif" font-size="24" fill="#526274">ReadyDorm turns emergency planning into clear action.</text>
  
    <g transform="translate(84 250)">
      <circle cx="18" cy="18" r="18" fill="#FA6A63"/>
      <text x="18" y="24" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
      <text x="58" y="14" font-size="25" font-weight="800" fill="#082B49">Prepare</text>
      <text x="58" y="45" font-size="18" fill="#526274">Emergency profile, contacts, backpack, and routes in one place.</text>
    </g>
  
    <g transform="translate(84 326)">
      <circle cx="18" cy="18" r="18" fill="#FA6A63"/>
      <text x="18" y="24" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
      <text x="58" y="14" font-size="25" font-weight="800" fill="#082B49">Respond</text>
      <text x="58" y="45" font-size="18" fill="#526274">SOS, safe check-ins, evacuation guidance, and nearby clinics.</text>
    </g>
  
    <g transform="translate(84 402)">
      <circle cx="18" cy="18" r="18" fill="#FA6A63"/>
      <text x="18" y="24" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
      <text x="58" y="14" font-size="25" font-weight="800" fill="#082B49">Coordinate</text>
      <text x="58" y="45" font-size="18" fill="#526274">Roommates, families, and residence managers stay aligned.</text>
    </g>
  
  <circle cx="1042" cy="360" r="84" fill="#FA6A63"/>
  <polygon points="1020,316 1020,404 1096,360" fill="#ffffff"/>
</svg>