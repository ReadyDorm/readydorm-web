  <text x="84" y="132" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#2EC5B6">READYDORM</text>
  <text x="84" y="194" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#082B49">About the Team</text>
  <text x="84" y="235" font-family="Inter, Arial, sans-serif" font-size="24" fill="#526274">Built by students for safer shared living.</text>
  
    <g transform="translate(84 250)">
      <circle cx="18" cy="18" r="18" fill="#2EC5B6"/>
      <text x="18" y="24" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
      <text x="58" y="14" font-size="25" font-weight="800" fill="#082B49">Research</text>
      <text x="58" y="45" font-size="18" fill="#526274">We focused on students, roommates, families, and residence managers.</text>
    </g>
  
    <g transform="translate(84 326)">
      <circle cx="18" cy="18" r="18" fill="#2EC5B6"/>
      <text x="18" y="24" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
      <text x="58" y="14" font-size="25" font-weight="800" fill="#082B49">Design</text>
      <text x="58" y="45" font-size="18" fill="#526274">We prioritized accessibility, fast decisions, and low cognitive load.</text>
    </g>
  
    <g transform="translate(84 402)">
      <circle cx="18" cy="18" r="18" fill="#2EC5B6"/>
      <text x="18" y="24" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
      <text x="58" y="14" font-size="25" font-weight="800" fill="#082B49">Build</text>
      <text x="58" y="45" font-size="18" fill="#526274">We delivered a responsive landing page deployed with GitHub Pages.</text>
    </g>
  
  <circle cx="1042" cy="360" r="84" fill="#2EC5B6"/>
  <polygon points="1020,316 1020,404 1096,360" fill="#ffffff"/>
